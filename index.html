<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="icon" type="image/x-icon" href="./assets/img/burger_img.png">
    <title>Bestello</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/standard.css">
    <link rel="stylesheet" href="./styles/basket.css">
</head>

<body onload="init()">
    <header class="site-header">
        <img src="./assets/icons/header_icon.svg" alt="">
    </header>
    <main>
        <section class="hero-section">
            <div class="hero-image-wrapper">
                <img src="./assets/img/hero_img.jpg" alt="table with food">
                <img src="./assets/img/burger_img.png" class="hero-burger" alt="cartoon burger">
            </div>
            <div class="hero-header">
                <div class="rating"><img src="./assets/icons/star_icon.svg" alt="">
                    <p>4,1 <span>(317)</span></p>
                </div>
                <h1><span>Burger</span>House</h1>
                <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
            </div>
        </section>
        <section class="main-content">
            <div class="main-content-left">
                <section class="pizza-section">
                    <header class="food-header">
                        <img src="./assets/icons/pizza_icon.svg" alt="pizza icon">
                        <h2>Pizza</h2>
                    </header>
                    <div class="food-container" id="pizza-section">
                    </div>
                </section>
                <section class="burger-section">
                    <header class="food-header">
                        <img src="./assets/icons/burger_icon.svg" alt="burger icon">
                        <h2>Burger</h2>
                    </header>
                    <div class="food-container" id="burger-section">
                    </div>
                </section>
                <section class="salad-section">
                    <header class="food-header">
                        <img src="./assets/icons/salad_icon.svg" alt="salad icon">
                        <h2>Salad</h2>
                    </header>
                    <div class="food-container" id="salad-section">
                    </div>
                </section>
            </div>
            <div class="main-content-right">
                <aside class="basket-aside" hidden>
                    <article class="dialog-content">
                        <h2>Your Basket</h2>
                        <div class="basket-content"></div>
                    </article>
                </aside>
            </div>
        </section>

    </main>
    <footer>
        <div class="footer">
            <p>Imprint</p>
            <p>Cookie Preferences</p>
            <p><img src="./assets/icons/copyright_icon.svg" alt=""> 2025 BurgerHouse</p>
        </div>
    </footer>
    <nav>
        <button>
            <img src="./assets/icons/Home_icon.svg" alt="">
        </button>
        <button>
            <img src="./assets/icons/Profile_icon.svg" alt="">
        </button>
        <button>
            <img src="./assets/icons/orders_icon.svg" alt="">
        </button>
        <button class="shopping-cart-wrapper" onclick="openBasketDialog()">
            <img src="./assets/icons/shopping_cart_icon.svg" alt="">
            <p class="shopping-cart-counter" id="shopping-cart-counter"></p>
        </button>
    </nav>
    <dialog class="basket-dialog" id="basket-dialog" aria-modal="true">
        <article class="dialog-content">
            <button onclick="closeBasketDialog()" class="close-dialog-button">
                <img src="./assets/icons/close.svg" alt="close icon">
            </button>
            <h2>Your Basket</h2>
            <div class="basket-content"></div>
        </article>
    </dialog>
    <dialog class="confirmed-dialog" id="confirmed-dialog" aria-modal="true">
        <button onclick="closeConfirmedDialog()" class="close-dialog-button">
            <img src="./assets/icons/close.svg" alt="close icon">
        </button>
        <div class="confirmed-wrapper">
            <img src="./assets/icons/on_delivery_icon.svg" alt="">
            <h2>Order confirmed!</h2>
            <h3>Your food is on the way!</h3>
        </div>
    </dialog>
</body>
<script src="./scripts/db.js"></script>
<script src="./scripts/template.js"></script>
<script src="./script.js"></script>

</html>
