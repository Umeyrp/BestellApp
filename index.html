<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <link rel="icon" type="image/x-icon" href="./assets/img/burger_img.png">
    <title>Bestello</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./styles/standard.css">
</head>

<body onload="init()">
    <header class="site-header">
        <img src="./assets/icons/header_icon.svg" alt="">
    </header>
    <main>
        <section class="hero-section">
            <div class="hero-image-wrapper">
                <img src="./assets/img/hero_img.jpg" alt="table with food">
                <img src="./assets/img/burger_img.png" class="hero-burger" alt="cartoon burger">
            </div>
            <div class="hero-header">
                <div class="rating"><img src="./assets/icons/star_icon.svg" alt="">
                    <p>4,1 <span>(317)</span></p>
                </div>
                <h1><span>Burger</span>House</h1>
                <p>The best of Burgers, Pizza, and Greens, all in one great place.</p>
            </div>
        </section>
        <section class="burger-section">
            <header class="burger-header">
                <img src="./assets/icons/pizza_icon.svg" alt="">
                <h2>Pizza</h2>
            </header>
            <div class="food-container" id="pizza-section">
            </div>
        </section>
        <section class="" id="dishes" aria-label="Gerichte">
        </section>
        <section class="" id="basket" aria-label="Warenkorb">
        </section>
        <p id="totalPrice"></p>
    </main>
    <footer>
        <p>Imprint</p>
        <p>Cookie Preferences</p>
        <p><img src="./assets/icons/copyright_icon.svg" alt=""> 2025 BurgerHouse</p>
    </footer>
    <nav>
        <button>
            <img src="./assets/icons/Home_icon.svg" alt="">
        </button>
        <button>
            <img src="./assets/icons/Profile_icon.svg" alt="">
        </button>
        <button>
            <img src="./assets/icons/orders_icon.svg" alt="">
        </button>
        <button class="shopping-cart-wrapper" onclick="openDialog()">
            <img src="./assets/icons/shopping_cart_icon.svg" alt="">
            <p class="shopping-cart-counter" id="shopping-cart-counter"></p>
        </button>
    </nav>
    <dialog class="basket-dialog" id="basket-dialog" aria-modal="true"></dialog>
</body>
<script src="./scripts/db.js"></script>
<script src="./scripts/template.js"></script>
<script src="./script.js"></script>

</html>
